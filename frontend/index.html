<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>Practice</title>
        <link rel ="stylesheet" href ="stylesheet.css">
    </head>

    <body>

        <div id = "productContainer"></div>

        <form id = "productForm">
            
            <p>Product Name: <input type = "text" id = "formName" required></p>
            <p>Description: <input type = "text" id = "formDesc" required></p>
            <p>Price: <input type = "number" id = "formPrice" required></p>
            <p>Stock: <input type = "number" id = "formStock" required></p>

           <p> Category: <select id = "formCategory">

                <option value = "1">Shirt</option>
                <option value = "2">Pants</option>
                <option value = "3">Boots</option>
                <option value = "4">Bags</option>
                
            </select>
            </p>

            <button type = "submit">Confirm</button>

            <p id = "confirmation"></p>

        </form>

        <script src = "script.js"></script>
    </body>

</html>
