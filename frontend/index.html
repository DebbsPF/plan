<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Practice</title>
    </head>

    <body>

        <div id = "displayProduct"></div>

        <form id = "productForm">
            
            <p>Product Name: <input id = "formName" type = "text" required></p>
            <p>Description: <input id = "formDesc" type = "text" required></p>
            <p>Price: <input id = "formPrice" type = "number" required min = 1 max = 100></p>
            <p>Stock: <input id = "formStock" type = "number" required min = 1 max = 100></p>

            <p> Category: 
                <select id = "formCategory">
                
                    <option value = "1">Shirt</option>
                    <option value = "2">Pants</option>
                    <option value = "3">Boots</option>
                    <option value = "4">Bags</option>

                </select>

            </p>

            <button type = "submit">Confirm</button>
            <div id = "confirmation"></div>

            <script src = "script.js"></script>
        </form>
    </body>

</html>
